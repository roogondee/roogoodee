name: LINE OA Rich Menu (LIFF quiz)

on:
  # manual only — rich menu เปลี่ยนไม่บ่อย รันเมื่อต้องการติดตั้ง/อัปเดตเท่านั้น
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (compose preview only, no API call)'
        type: boolean
        default: true
      cleanup:
        description: 'Delete old rich menus after install'
        type: boolean
        default: false

jobs:
  richmenu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compose and install rich menu
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          RICHMENU_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          RICHMENU_CLEANUP: ${{ inputs.cleanup && '1' || '0' }}
        run: python scripts/line_richmenu.py

      - name: Upload preview artifact (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: richmenu-preview
          path: |
            /tmp/richmenu_preview.png
            /tmp/richmenu_object.json
