name: 📘 RuGonDee Facebook Daily Caption

on:
  # ⏸️ schedule ปิดชั่วคราว 2026-09-10 ตามที่เจ้าของ repo สั่ง — FB_PAGE_ACCESS_TOKEN
  # ยังไม่ใช่ Page token ที่ใช้ได้ preflight จึงล้มทุกเช้าและยิง alert ทิ้งไว้
  # โดยไม่มีอะไรให้แก้ในโค้ด ต้นเหตุ + วิธีเปิดคืน: docs/fb-token-runbook.md ข้อ 2C
  # เปิดคืน = เอา `# ` ออกจากบล็อกข้างล่างทั้งบล็อก (ต้องเอาออกทั้ง `schedule:` และ
  # บรรทัด cron — ถ้าเหลือ `schedule:` ลอย ๆ ไม่มีรายการ GitHub จะตีว่า workflow เสีย)
  # workflow_dispatch ยังกดรันเองได้ตลอดระหว่างนี้
  # schedule:
  #   - cron: "30 3 * * *"   # 03:30 UTC = 10:30 Bangkok ทุกวัน (หลัง autopost)
  workflow_dispatch:

jobs:
  fb_caption:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 📘 Post daily caption to Facebook
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET:          ${{ secrets.SUPABASE_SECRET }}
          FB_PAGE_ID:               ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:     ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_APP_ID:                ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET:            ${{ secrets.FB_APP_SECRET }}
          SITE_BASE_URL:            ${{ secrets.SITE_BASE_URL }}
          DISCORD_WEBHOOK_URL:        ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL:          ${{ secrets.SLACK_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN:  ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID:             ${{ secrets.LINE_TARGET_ID }}
          LINE_NOTIFY_TOKEN:          ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: python scripts/fb_caption.py
